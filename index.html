    var status = S.saved ? 'Tus respuestas ya le llegaron a Raúl.' : (S.sending ? 'Enviando tus respuestas…' : 'Tus respuestas le llegan a Raúl.');
    h+='<section class="screen"><span class="muted" style="font-size:15px">'+esc(S.name||'Oye')+', sacaste</span>'+
    '<div class="score"><span class="n">'+sc+'</span><span class="d">/'+MC_TOTAL+'</span></div>'+
    '<h2 style="margin-top:18px;color:#D4FF3F">'+tier+'</h2><p class="muted" style="margin:8px 0 0;font-size:15px">'+line+'</p>'+
    '<div class="card" style="padding:18px"><p style="margin:0;font-size:15px;line-height:1.45">El ranking es secreto. Raúl lo revela en su cumple.</p><p class="muted" style="margin:6px 0 0;font-size:13px">'+status+'</p>';
    h+='</div><div class="bottom"><div class="grid2"><button class="btn btn-main" id="share">Retar a un amigo</button><button class="btn btn-ghost" id="again">Otra vez</button></div></div></section>';
  }
  app.innerHTML=h;
  bind();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ app.querySelectorAll('.fill').forEach(function(f){ f.style.width=f.getAttribute('data-w'); }); }); });
}

function bind(){
  var n=document.getElementById('nombre');
  if(n){ n.addEventListener('input',function(e){ var had=!!S.name.trim(); S.name=e.target.value; if(had!==!!S.name.trim()){ var b=document.getElementById('go'); b.className='btn '+(S.name.trim()?'btn-main':'btn-off'); } });
    n.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); }); }
  var go=document.getElementById('go'); if(go) go.onclick=start;
  app.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
    if(S.picked!==null) return;
    var i=+b.getAttribute('data-i'), q=QUESTIONS[S.qi];
    S.picked=i; S.answers[S.qi]=i; if(!q.poll&&i===q.a) S.score++;
    if(navigator.vibrate) navigator.vibrate(i===q.a||q.poll?20:[30,40,30]);
    render();
  };});
  var nx=document.getElementById('next'); if(nx) nx.onclick=function(){
    if(S.picked===null) return;
    S.picked=null;
    if(S.qi<QUESTIONS.length-1) S.qi++; else S.step='open';
    render(); window.scrollTo(0,0);
  };
  var ta=document.getElementById('abierta'); if(ta){ ta.addEventListener('input',function(e){ S.open[S.oi]=e.target.value; }); }
  var no=document.getElementById('nextOpen'); if(no) no.onclick=function(){
    if(S.oi<OPEN.length-1){ S.oi++; render(); }
    else { S.step='result'; render(); save().then(render); }
    window.scrollTo(0,0);
  };
  var sh=document.getElementById('share'); if(sh) sh.onclick=function(){
    var txt='Saqué '+S.score+'/'+MC_TOTAL+' en "¿Qué tanto conoces a Raúl?". A ver si me ganas: '+location.href;
    if(navigator.share){ navigator.share({title:'¿Qué tanto conoces a Raúl?',text:txt}).catch(function(){}); }
    else { window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }
  };
  var ag=document.getElementById('again'); if(ag) ag.onclick=function(){
    S.step='intro'; S.qi=0; S.picked=null; S.score=0; S.answers=[]; S.oi=0; S.open=['','']; render();
  };
}
function start(){ if(!S.name.trim()){ document.getElementById('nombre').focus(); return; } S.step='mc'; render(); }

loadRows().then(render);
render();
</script>
</body>
</html>
